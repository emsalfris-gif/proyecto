<!DOCTYPE html>

    <meta charset="UTF-8"><title>Catálogo de Imágenes</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; text-align: center; }
        h1 { color: #333; margin-bottom: 25px; }
        
        .zapatillas { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        
        
        .zapatillas a { 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: white; 
            padding: 10px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            transition: transform 0.2s; 
            height: 200px
            overflow: hidden }
        
         .zapatillas a:hover { transform: scale(1.04); }
        
        
        .zapatillas img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; / }
    </style>
</head>
<body>
